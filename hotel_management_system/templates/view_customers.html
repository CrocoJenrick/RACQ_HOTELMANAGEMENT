<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>
</head>
<body>

<center>
    <h1>Customer List</h1>

    <table border="1" cellpadding="5">
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>

        {% for c in customers %}
        <tr>
            <td>{{ c[1] }}</td>
            <td>{{ c[2] }}</td>
            <td>{{ c[3] }}</td>
            <td>
                <a href="{{ url_for('edit_customer', id=c[0]) }}">Edit</a> |
                <a href="{{ url_for('delete_customer', id=c[0]) }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="{{ url_for('admin_dashboard') }}">Back</a>
</center>

</body>
</html>
